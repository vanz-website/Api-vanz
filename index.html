<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝑉𝑎𝑛𝑧𝑋𝑇𝑃 - CREATE KEY</title>
    <script src="config.js"></script>
    <style>
        :root { --cyan: #00f2ff; --pink: #ff007f; --dark: #050505; }
        body { background: var(--dark); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .snow { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; background: radial-gradient(circle, #fff 1px, transparent 1px); background-size: 50px 50px; animation: snowMove 15s linear infinite; opacity: 0.3; }
        @keyframes snowMove { from { transform: translateY(0); } to { transform: translateY(1000px); } }
        .panel { background: rgba(15, 15, 15, 0.9); border: 1px solid var(--cyan); padding: 30px; border-radius: 20px; width: 380px; box-shadow: 0 0 20px var(--cyan); }
        h1 { color: var(--cyan); text-align: center; letter-spacing: 5px; font-size: 22px; text-shadow: 0 0 10px var(--cyan); }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #333; color: white; border-radius: 8px; outline: none; }
        button.main { width: 100%; padding: 15px; background: linear-gradient(45deg, var(--cyan), var(--pink)); border: none; color: white; font-weight: bold; border-radius: 10px; cursor: pointer; text-transform: uppercase; }
        .key-list { margin-top: 20px; max-height: 200px; overflow-y: auto; }
        .key-item { background: #111; padding: 10px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; border-left: 3px solid var(--pink); }
        .btn-group button { padding: 5px 10px; border-radius: 5px; border: none; cursor: pointer; font-size: 10px; font-weight: bold; color: white; margin-left: 4px; }
    </style>
</head>
<body>
<div class="snow"></div>
<div class="panel">
    <h1>𝑉𝑎𝑛𝑧𝑋𝑇𝑃 KEY</h1>
    <input type="text" id="k" placeholder="Key Name">
    <input type="date" id="e">
    <button class="main" onclick="add()">GENERATE</button>
    <div id="status" style="text-align:center; font-size:10px; margin-top:10px; color:#555;">Ready</div>
    <div class="key-list" id="list"></div>
</div>
<script>
    let keys = [];
    async function sync() {
        const s = document.getElementById('status'); s.innerText = "Syncing...";
        const url = `https://api.github.com/repos/${CONFIG.GH_USER}/${CONFIG.GH_REPO}/contents/${CONFIG.GH_FILE}`;
        const res = await fetch(url, { headers: { "Authorization": `token ${CONFIG.GH_TOKEN}` } });
        const data = await res.json();
        const upd = await fetch(url, { method: "PUT", headers: { "Authorization": `token ${CONFIG.GH_TOKEN}` },
            body: JSON.stringify({ message: "V4 Update", content: btoa(keys.join("\n")), sha: data.sha }) });
        s.innerText = upd.ok ? "Synced! ✅" : "Error! ❌";
    }
    async function load() {
        const url = `https://api.github.com/repos/${CONFIG.GH_USER}/${CONFIG.GH_REPO}/contents/${CONFIG.GH_FILE}`;
        const res = await fetch(url, { headers: { "Authorization": `token ${CONFIG.GH_TOKEN}` } });
        if(res.ok) { const d = await res.json(); keys = atob(d.content).split("\n").filter(x => x); render(); }
    }
    function add() { const kn = document.getElementById('k').value, ed = document.getElementById('e').value; if(kn && ed) { keys.push(`${kn}|${ed}`); render(); sync(); } }
    function del(i) { keys.splice(i,1); render(); sync(); }
    function copy(t) { navigator.clipboard.writeText(t); alert("Key Copied!"); }
    function render() {
        document.getElementById('list').innerHTML = keys.map((x, i) => `
        <div class="key-item">
            <div style="font-size:12px;"><b>${x.split('|')[0]}</b><br><small>${x.split('|')[1]}</small></div>
            <div class="btn-group">
                <button style="background:#333;" onclick="copy('${x.split('|')[0]}')">COPY</button>
                <button style="background:#f33;" onclick="del(${i})">DEL</button>
            </div>
        </div>`).join("");
    }
    load();
</script>
</body>
</html>
